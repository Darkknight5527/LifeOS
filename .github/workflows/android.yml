# Builds the LifeOS Android app and publishes the APK as a GitHub release
# ("android-latest"), so it can be downloaded straight onto the phone.
name: Android app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      # Actions are pinned to exact versions so a changed tag can't slip in other code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Sign with your own key when the four ANDROID_* secrets are set in the
      # repo settings (Settings → Secrets and variables → Actions). Without
      # them the app is signed with the shared debug key, as before.
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lifeos.keystore"
          echo "LIFEOS_KEYSTORE_FILE=$RUNNER_TEMP/lifeos.keystore" >> "$GITHUB_ENV"
          echo "::notice::Signing with your own key (ANDROID_KEYSTORE_BASE64 is set)."
          # Catch a wrong password / alias here, with a clear message.
          if ! keytool -list -keystore "$RUNNER_TEMP/lifeos.keystore" -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Signing secrets don't match::The keystore couldn't be opened with ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS. Re-copy all 4 values from LifeOS-app-signing-secrets.txt into GitHub secrets."
            exit 1
          fi
          node scripts/release-signing.js

      - name: Build the APK
        working-directory: mobile/android
        env:
          LIFEOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFEOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFEOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Keep the log so a failure can be reported as a readable error.
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            MSG=$(grep -A12 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -20 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-900)
            [ -z "$MSG" ] && MSG=$(grep -iE "error|failed|exception" "$RUNNER_TEMP/gradle.log" | tail -8 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Gradle build failed::$MSG"
            exit 1
          fi

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk LifeOS.apk
          NOTES="LifeOS for Android v${VERSION} — built from ${GITHUB_SHA::7} on $(date -u +'%d %b %Y %H:%M UTC'). Download LifeOS.apk on your phone and open it to install or update."
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest LifeOS.apk --title "LifeOS Android app" --notes "$NOTES" --latest
