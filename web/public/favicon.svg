<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- faint full ring -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="6"/>
  <!-- progress arc (about three quarters) -->
  <path d="M32 15 A17 17 0 1 1 15 32" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- check mark in the middle -->
